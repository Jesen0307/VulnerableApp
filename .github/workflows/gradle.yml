name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683174 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf1140972e964a23852bf206735ea8fe0 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@b9fd7d16f58900c3a6a0ed9274c9f5ff1a7fc72ab # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
